apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "nexus-operator.labels" . | nindent 4 }}
  name: edp-{{ .Values.name }}-{{ .Release.Namespace }}-nexus-admin
rules:
  - apiGroups:
      - edp.epam.com
    resources:
      - nexuses
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - edp.epam.com
    resources:
      - nexuses/status
    verbs:
      - get
