name: Go

on:
  push:
    branches: [ master ]

env:
  GOLANG_VERSION: '1.26'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Upload codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
