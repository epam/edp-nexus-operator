apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nexus-operator
    app.kubernetes.io/managed-by: kustomize
  name: nexusblobstore-admin-role
# Only role that may write this kind; bind to platform admins only.
rules:
- apiGroups:
  - edp.epam.com
  resources:
  - nexusblobstores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - edp.epam.com
  resources:
  - nexusblobstores/status
  verbs:
  - get
